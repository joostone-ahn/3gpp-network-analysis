# config/preprocessing.yaml
# 전처리 설정
# Requirements: 3.2, 4.2, 4.3, 5.2, 5.3, 6.2

# =============================================================================
# Title 기반 필터링 (Stage 2)
# =============================================================================

# 제외 대상 패턴 (12개 LS 관련 패턴 + CR pack)
# case-insensitive 적용
title_exclude_patterns:
  - "LS on"
  - "LS to"
  - "LS Reply"
  - "Reply LS"
  - "LS in relation to"
  - "LS for"
  - "LS regarding"
  - "LS response"
  - "LS out"
  - "LS answer"
  - "LS about"
  - "LS-Replay"
  - "CR pack"

# =============================================================================
# Source 문자열 정제 규칙 (Stage 3 - 매칭 전 전처리)
# =============================================================================

source_cleaning:
  # 특수 치환 (MCC 필터링 전 예외처리)
  special_replacements:
    CMCC: "China Mobile"
  
  # 제거할 문자 목록
  remove_characters:
    - "["
    - "]"
    - "."
  
  # 단어 경계 공백 추가 (부분 문자열 오매칭 방지)
  add_word_boundary_spaces: true

# =============================================================================
# 멤버십 정규화 규칙 (Stage 3 - 8단계 순차 적용)
# 개수는 2026-09 원본 노트북 재검증 결과 정정
# =============================================================================

membership_normalization:
