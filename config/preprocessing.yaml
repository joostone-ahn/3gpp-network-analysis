  # c) removes - 특정 지명 제거 (4개)
  removes:
    - "Beijing"
    - "Nanjing"
    - "Chengdu"
    - "Telecommunications Cor"

  # d) replaces - 특수 매핑 (15개)
  replaces:
    "Guangdong OPPO": "OPPO"
    "Chinatelecom": "China Telecom"
    "DOCOMO": "NTT Docomo"
    "NTT": "NTT Docomo"
    "GW": "Greenerwave"
    "GM - ATCI": "GM"
    "HuaWei": "Huawei"
    "Huawei Device": "Huawei"
    "IBM Europe": "IBM"
    "Indian Institute of Tech (M)": "IIT Madras"
    "Indian Institute of Tech (H)": "IIT Hyderabad"
    "L.M. Ericsson": "Ericsson"
    "Security Service": "Swedish Security Service"
    "Telekom": "Deutsche Telekom"
    "Deutsche Deutsche": "Deutsche"

  # e) brackets - 괄호 제거 패턴
  # 여는 괄호 기준 분리: re.split(brackets_pattern, name)[0]
  brackets_pattern: "\\s\\("

  # f) startswith - 통합 예외 목록 (4개)
  # 정렬 후 prefix 기반 통합 시 예외 처리할 기업명
  startswith_exceptions:
    - "BTL"
    - "CISA ECD"
