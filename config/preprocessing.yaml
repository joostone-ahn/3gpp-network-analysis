# =============================================================================
# Work Item 분리 설정 (Stage 4)
# =============================================================================

# WI 구분자 목록
wi_delimiters:
  - ","

# 제외할 WI 패턴 (부분 문자열 매칭, case-insensitive)
# 원본 노트북은 str.contains(r'TEI|DUMMY', flags=re.IGNORECASE) 사용
wi_exclude_patterns:
  - "TEI"
  - "DUMMY"

# =============================================================================
# 시간 정보 설정 (Stage 5)
# =============================================================================

date_range:
  # 분석 대상 최소 연도 (이전 연도는 제외)
  # 원본 노트북: 2015년 이전 데이터 2건(1999년 등) 제외
  min_year: 2015
